cargo-features = ["codegen-backend"]
[package]
name = "call_scripters"
version = "0.2.1"
edition = "2024"
description = "Call scripts as markdown, followed as a clickable conversation graph in one offline html file"
license = "BlueOak-1.0.0"
repository = "https://github.com/ev-main/call_scripters"
include = ["src/main.rs", "LICENSE", "README.md", "web/style.css", "web/vendor/marked.min.js", "web/vendor/dagre.min.js", "web/model.js", "web/view.js", "web/template.html", ".cargo/*", "build.rs"]

[package.metadata]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
clap = { version = "^4.5.4", features = ["derive"] }
color-eyre = "^0.6.5"
tiny_http = "^0.12.0"

[lints.clippy]
# Stable
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow" # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
doc_lazy_continuation = "allow" # tries to make me add a newline after a list in docs

# Questionable
# const fns, so actually more performant
get_first = "allow"
get_last_with_len = "allow"
manual_is_multiple_of = "allow"

[lints.cargo]
non_kebab_case_bins = "allow"

[lints.rust]
unused_features = "allow"

[profile.dev.package.call_scripters]
debug = true # global default is line-tables-only
