cargo-features = ["codegen-backend"]
[package]
name = "scripters"
version = "0.2.10"
edition = "2024"
description = "Call scripts as markdown, followed as a clickable conversation graph in one offline html file"
license = "BlueOak-1.0.0"
repository = "https://github.com/ev-main/scripters"
include = [
    "src/main.rs",
    "LICENSE",
    "README.md",
    "web/model.js",
    "web/translate.js",
    "web/icon.svg",
    "web/style.css",
    "web/vendor/marked.min.js",
    "web/vendor/dagre.min.js",
    "web/place.js",
    "web/merge.js",
    "web/layout.js",
    "web/view.js",
    "web/template.html",
    ".cargo/*",
    "build.rs",
]

[package.metadata]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
ask_llm = { version = "^3", default-features = false }
clap = { version = "^4.6.7", features = ["derive"] }
color-eyre = "^0.6.5"
futures = "^0.3.34"
rquickjs = "^0.14.0"
serde_json = "^1.0.154"
tempfile = "^3.27.0"
tiny_http = "^0.12.0"
tokio = { version = "^1.54.1", features = ["rt"] }

[dev-dependencies]
v_fixtures = "^0.3.4"

[lints.clippy]
# Stable
float_cmp = "allow"                 # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow"                  # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
doc_lazy_continuation = "allow"     # tries to make me add a newline after a list in docs

# Questionable
# const fns, so actually more performant
get_first = "allow"
get_last_with_len = "allow"
manual_is_multiple_of = "allow"

[lints.cargo]
non_kebab_case_bins = "allow"

[lints.rust]
stable_features = "allow"
unused_features = "allow"
