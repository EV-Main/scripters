<!DOCTYPE html>
<html lang="en" data-rankdir="LR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo</title>
<style>
:root {
	--ink: oklch(0.25 0.015 255);
	--muted: oklch(0.53 0.02 255);
	--line: oklch(0.85 0.012 255);
	--paper: oklch(0.97 0.004 265);
	--card: oklch(1 0 0);
	--bar: oklch(1 0 0 / 0.94);
	--accent: oklch(0.55 0.17 260);
	--accent-soft: oklch(0.95 0.02 260);
	--accent-line: oklch(0.82 0.07 260);
	--edge: oklch(0.72 0.015 255);
	--code: oklch(0.955 0.003 265);
	--chip: oklch(0.96 0.04 80);
	--chip-ink: oklch(0.5 0.11 70);
	--chip-line: oklch(0.89 0.07 80);
	--danger: oklch(0.58 0.21 27);
	--error: oklch(0.45 0.16 27);
	--error-bg: oklch(0.95 0.025 20);
	--error-line: oklch(0.83 0.08 20);
	--shadow: oklch(0 0 0 / 0.1);
	color-scheme: light;
	font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
	color: var(--ink);
	background: var(--paper);
}
:root[data-theme='dark'] {
	--ink: oklch(0.94 0 0);
	--muted: oklch(0.7 0 0);
	--line: oklch(0.38 0 0);
	--paper: oklch(0.24 0 0);
	--card: oklch(0.29 0 0);
	--bar: oklch(0.27 0 0 / 0.94);
	--accent: oklch(0.68 0.14 260);
	--accent-soft: oklch(0.32 0.04 260);
	--accent-line: oklch(0.48 0.09 260);
	--edge: oklch(0.52 0 0);
	--code: oklch(0.34 0 0);
	--chip: oklch(0.33 0.04 80);
	--chip-ink: oklch(0.85 0.09 80);
	--chip-line: oklch(0.45 0.06 80);
	--danger: oklch(0.68 0.19 25);
	--error: oklch(0.85 0.08 20);
	--error-bg: oklch(0.32 0.06 20);
	--error-line: oklch(0.45 0.1 20);
	--shadow: oklch(0 0 0 / 0.35);
	color-scheme: dark;
}
body {
	margin: 0;
}
button,
select,
input {
	font: inherit;
	color: var(--ink);
}

#bar {
	position: fixed;
	inset: 0 0 auto 0;
	z-index: 10;
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 0.5rem 1rem;
	padding: 0.6rem 1rem;
	background: var(--bar);
	border-bottom: 1px solid var(--line);
	backdrop-filter: blur(6px);
}
#bar .title {
	font-size: 1.05rem;
}
#bar .dirty {
	color: var(--danger);
	font-size: 0.85rem;
}
#bar .dim {
	color: var(--muted);
	font-size: 0.9rem;
}
#bar select,
#bar button,
#bar summary,
.labels button {
	font-size: 0.9rem;
	padding: 0.2rem 0.6rem;
	border: 1px solid var(--line);
	border-radius: 6px;
	background: var(--card);
	cursor: pointer;
}
#bar .push {
	margin-left: auto;
}

.menu {
	position: relative;
}
.menu summary {
	list-style: none;
}
.menu summary::after {
	content: ' ▾';
	color: var(--muted);
}
.menu .items {
	position: absolute;
	right: 0;
	top: calc(100% + 4px);
	display: flex;
	flex-direction: column;
	gap: 2px;
	padding: 4px;
	background: var(--card);
	border: 1px solid var(--line);
	border-radius: 8px;
	box-shadow: 0 4px 16px var(--shadow);
}
#bar .menu .items button {
	border: none;
	text-align: left;
}
#bar .menu .items button:hover {
	background: var(--accent-soft);
}

#canvas {
	position: relative;
	min-width: 100%;
}
#canvas > svg {
	position: absolute;
	inset: 0 auto auto 0;
	pointer-events: none;
}
#canvas path {
	fill: none;
	stroke: var(--edge);
	stroke-width: 1.5;
}
#canvas path.visited {
	stroke: var(--accent);
	stroke-width: 2.5;
}

.card {
	position: absolute;
	box-sizing: border-box;
	width: 380px;
	padding: 0.9rem 1.1rem;
	background: var(--card);
	border: 1px solid var(--line);
	border-radius: 10px;
	box-shadow: 0 1px 3px var(--shadow);
	cursor: pointer;
	transition: box-shadow 0.15s;
}
.card:hover {
	box-shadow: 0 3px 12px var(--shadow);
}
.card.visited {
	background: var(--accent-soft);
	border-color: var(--accent-line);
}
.card.current {
	border: 2px solid var(--accent);
	box-shadow: 0 0 0 4px oklch(from var(--accent) l c h / 0.2), 0 4px 16px var(--shadow);
}
.card.terminal {
	border-bottom: 6px solid var(--ink);
}
.card.editing {
	z-index: 5;
	cursor: auto;
	box-shadow: 0 8px 30px var(--shadow);
}
.card header {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 0.4rem;
	margin-bottom: 0.4rem;
	padding-right: 1rem;
}
.card h2 {
	flex-basis: 100%;
	margin: 0;
	font-size: 1.1rem;
	line-height: 1.3;
}
.card .delete {
	position: absolute;
	top: 0.3rem;
	right: 0.4rem;
	padding: 0 0.3rem;
	font-size: 1.1rem;
	line-height: 1;
	color: var(--danger);
	background: none;
	border: none;
	border-radius: 4px;
	cursor: pointer;
	opacity: 0.55;
}
.card .delete:hover {
	opacity: 1;
	background: var(--error-bg);
}
.chip {
	font: 0.72rem/1.4 ui-monospace, monospace;
	padding: 0 0.4rem;
	border-radius: 999px;
	background: var(--chip);
	color: var(--chip-ink);
	border: 1px solid var(--chip-line);
}
.pill {
	display: inline-flex;
	align-items: center;
	gap: 0.15rem;
	font-size: 0.75rem;
	font-weight: 500;
	line-height: 1.5;
	padding: 0 0.55rem;
	border-radius: 999px;
	white-space: nowrap;
}
.pill .unlabel {
	padding: 0;
	margin-right: -0.2rem;
	font-size: 0.85rem;
	line-height: 1;
	color: inherit;
	background: none;
	border: none;
	cursor: pointer;
	opacity: 0.7;
}
.pill .unlabel:hover {
	opacity: 1;
}
.add {
	appearance: none;
	width: 1.6rem;
	text-align-last: center;
	font-size: 0.75rem;
	line-height: 1.5;
	padding: 0 0.45rem;
	color: var(--muted);
	background: none;
	border: 1px dashed var(--line);
	border-radius: 999px;
	cursor: pointer;
}
.add:hover {
	color: var(--ink);
	border-color: var(--muted);
}
.body > :first-child {
	margin-top: 0;
}
.body > :last-child {
	margin-bottom: 0;
}
.body p,
.body ul,
.body ol {
	margin: 0.5rem 0;
}
.body blockquote {
	margin: 0.5rem 0;
	padding-left: 0.8rem;
	border-left: 3px solid var(--line);
	color: var(--muted);
}
.body code {
	font-size: 0.88em;
	background: var(--code);
	padding: 0 0.25em;
	border-radius: 3px;
}

.label {
	position: absolute;
	max-width: 170px;
	padding: 0.15rem 0.6rem;
	font: inherit;
	font-size: 0.82rem;
	line-height: 1.35;
	text-align: center;
	color: var(--ink);
	background: var(--card);
	border: 1px solid var(--line);
	border-radius: 999px;
	cursor: pointer;
}
.label:hover {
	border-color: var(--accent);
}
.label.visited {
	background: var(--accent);
	border-color: var(--accent);
	color: var(--card);
}

.labels {
	box-sizing: border-box;
	width: min(52rem, 94vw);
	padding: 0;
	color: var(--ink);
	background: var(--card);
	border: 1px solid var(--line);
	border-radius: 10px;
	box-shadow: 0 12px 40px var(--shadow);
}
.labels::backdrop {
	background: oklch(0 0 0 / 0.4);
}
.labels > header {
	display: flex;
	align-items: center;
	gap: 0.5rem;
	padding: 0.8rem 1rem;
	background: var(--paper);
	border-bottom: 1px solid var(--line);
}
.labels h2 {
	flex: 1;
	margin: 0;
	font-size: 1rem;
}
.labels .primary {
	color: oklch(1 0 0);
	background: oklch(0.55 0.15 150);
	border-color: oklch(0.5 0.15 150);
}
.labels ul {
	margin: 0;
	padding: 0;
	list-style: none;
}
.labels li {
	display: grid;
	grid-template-columns: 14rem 1fr 6rem auto auto;
	align-items: center;
	gap: 1rem;
	padding: 0.7rem 1rem;
	border-bottom: 1px solid var(--line);
}
.labels li:last-child {
	border-bottom: none;
}
.labels .description,
.labels .uses {
	color: var(--muted);
	font-size: 0.85rem;
}
.labels .pill {
	justify-self: start;
}
.labels button.link {
	padding: 0;
	color: var(--muted);
	background: none;
	border: none;
}
.labels button.link:hover {
	color: var(--accent);
	text-decoration: underline;
}
.labels button.danger:hover {
	color: var(--danger);
}
.editor {
	display: flex;
	flex-wrap: wrap;
	align-items: end;
	gap: 0.6rem 1rem;
	padding: 1rem;
	background: var(--paper);
	border-bottom: 1px solid var(--line);
}
.editor .preview {
	flex-basis: 100%;
}
.editor label {
	display: flex;
	flex-direction: column;
	gap: 0.25rem;
	font-size: 0.85rem;
	font-weight: 600;
}
.editor input {
	font-size: 0.9rem;
	font-weight: 400;
	padding: 0.25rem 0.5rem;
	background: var(--card);
	border: 1px solid var(--line);
	border-radius: 6px;
}
.editor input:invalid {
	border-color: var(--danger);
}
.editor .color {
	display: flex;
	gap: 0.4rem;
}
.editor .swatches {
	display: flex;
	flex-wrap: wrap;
	gap: 4px;
	flex-basis: 100%;
}
.labels .editor .swatches button {
	width: 1.4rem;
	height: 1.4rem;
	padding: 0;
	border: none;
	border-radius: 4px;
}
.editor > div:last-child {
	flex-basis: 100%;
}

textarea {
	box-sizing: border-box;
	width: 100%;
	min-height: 8rem;
	font: 0.85rem/1.45 ui-monospace, monospace;
	color: var(--ink);
	background: var(--card);
	border: 1px solid var(--line);
	border-radius: 6px;
	padding: 0.5rem;
	resize: vertical;
}
.errors {
	margin: 0.5rem 0 0;
	padding: 0.6rem 0.6rem 0.6rem 1.6rem;
	color: var(--error);
	background: var(--error-bg);
	border: 1px solid var(--error-line);
	border-radius: 6px;
	font-size: 0.9rem;
}
#canvas > .errors {
	max-width: 50rem;
	margin: 2rem;
}

</style>
</head>
<body>
<header id="bar"></header>
<main id="canvas"></main>

# Introduction
Hi, this is **Sam** from Brightline. Did I catch you at an okay time?

> Pause. Let them answer before going on.

- [Has a minute](#opening)
- [Busy right now](#schedule-callback)
- [Who is this?](#who-is-this)

# Who is this?
Fair question. I'm Sam with **Brightline**: we help service teams cut missed calls. I'll be quick.

- [Okay, go on](#opening)
- [Not interested](#not-interested)

# Opening {opener=warm}
Great. I saw you recently expanded to a second location, congrats! Teams growing that fast often tell us
calls start slipping through the cracks. Is that something you've noticed?

- [Yes, it happens](#discovery)
- [Not really](#not-interested)

# Opening {opener=cold}
Thanks. Quick question: roughly how many inbound calls does your front desk handle on a busy day?

- [Gives a number](#discovery)
- [Why do you ask?](#why-do-you-ask)

# Why do you ask?
We've found that past about **40 calls a day**, most teams miss 1 in 5 without realizing it.
I was curious whether you're in that range.

- [Gives a number](#discovery)
- [Not interested](#not-interested)

# Discovery
Got it. And when a call is missed today, what happens next?

- Does someone call back?
- Is there a voicemail flow?
- Who owns follow-up?

- [We call back manually](#pitch)
- [We don't, really](#pitch)

# Pitch
That's exactly the gap we close. Brightline answers overflow calls, books the job, and drops it straight into
your calendar. Most teams see the first booked job inside a week.

- [Sounds good](#close)
- [Too expensive](#price-objection)
- [We already use something](#competitor-objection)
- [Let me think about it](#think-about-it)

# Anything else?
Makes sense. Other than that, is there anything else that would stop you from getting started?

> The first objection is rarely the last. Keep asking until the answer is no.

- [No, that's it](#close)
- [Price](#price-objection)
- [Timing](#timing-objection)
- [Current provider](#competitor-objection)
- [Needs to ask someone](#partner-objection)
- [Needs to think](#think-about-it)
- [Tried this before](#doubt-objection)

# Price objection {.objection}
Totally fair. Is it the price itself, or not being sure it pays for itself? One recovered job usually covers
the month. Want me to run the numbers for a team your size?

- [Okay, that makes sense](#anything-else)
- [Still too much](#not-interested)

# Timing objection {.objection .rework}
Understood. What would be different a month from now? Every week we wait is another week of missed calls,
and setup takes about an hour on your side.

- [Fair point](#anything-else)
- [Really not now](#schedule-callback)

# Competitor objection
Makes sense. Out of curiosity, what do you like most about it, and what would you change?

- [Open to comparing](#anything-else)
- [Happy with it](#not-interested)

# Partner objection
Of course. If they were on this call and liked it, would you want to go ahead? Then let's put 15 minutes on
the calendar with both of you, so they hear it first-hand.

- [Yes, let's include them](#anything-else)
- [They'd say no](#not-interested)

# Think about it
Of course. Usually when someone wants to think it over, it's one of three things: the money, whether it'll
actually work for you, or someone else who needs to weigh in. Which is it for you?

- [The money](#price-objection)
- [Whether it'll work](#doubt-objection)
- [Someone else decides](#partner-objection)
- [Nothing specific](#close)

# Doubt objection
That's worth hearing. What went wrong last time? Most teams who come to us were burned by a generic answering
service reading a script. We book straight into your calendar, and you hear every call.

- [That's different](#anything-else)
- [Still skeptical](#not-interested)

# Close
Let's do this: I'll set up a 15-minute walkthrough with your numbers. Does **Thursday at 10** or
**Friday at 2** work better?

- [Books a slot](#booked)
- [Hesitates](#anything-else)
- [Busy right now](#schedule-callback)

# Booked {.win}
Perfect, you'll get an invite in a minute. Thanks for your time!

# Schedule callback
No problem at all. When's a better time to reach you, later today or tomorrow morning?

# Not interested
Understood, I appreciate you being upfront. Mind if I send a short email in case things change?

	const nodes = [];
	const labels = [];

		const head = el('header');
		for (const [k, v] of Object.entries(n.tags)) head.append(el('span', 'chip', `${k}=${v}`));
		for (const name of n.labels) {
			const p = pill(graph.labels.find(l => l.name === name));
			const x = el('button', 'unlabel', '×');
			x.title = `remove ${name}`;
			x.addEventListener('click', e => {
				e.stopPropagation();
				assert(!commit(splice([attrs(n, n.labels.filter(l => l !== name))])), 'removing a label broke the document');
			});
			p.append(x);
			head.append(p);
		}
		head.append(labelPicker(n));
		head.append(el('h2', '', marked.parseInline(n.title)));
		const del = el('button', 'delete', '×');
		del.title = 'delete card (select, then Backspace)';
		del.addEventListener('click', e => {
			e.stopPropagation();
			remove(n);
		});
		card.append(del, head, el('div', 'body', marked.parse(n.body)));
		card.addEventListener('click', () => click(n));
		canvas.append(card);
		cards.set(n.id, card);
	}
	const labels = edges.map(e => {
		const label = el('button', 'label', marked.parseInline(e.label));
		label.classList.toggle('visited', walked.has(`${e.from}\n${e.to}`));
		label.addEventListener('click', () => {
			if (editing) return;
			go(e.to, e.from);
			reveal(e.to);
		});
		canvas.append(label);
		return label;
	});

	const g = new dagre.graphlib.Graph({ multigraph: true });
	g.setGraph({ rankdir: RANKDIR, nodesep: 36 * spacing, ranksep: 60 * spacing, edgesep: 16 * spacing, marginx: 48, marginy: 48 });
	for (const n of nodes) g.setNode(n.id, { width: cards.get(n.id).offsetWidth, height: cards.get(n.id).offsetHeight });
	edges.forEach((e, i) => g.setEdge(e.from, e.to, { width: labels[i].offsetWidth, height: labels[i].offsetHeight, labelpos: 'c' }, String(i)));
	dagre.layout(g);

	for (const n of nodes) {
		const { x, y, width, height } = g.node(n.id);
		Object.assign(cards.get(n.id).style, { left: `${x - width / 2}px`, top: `${y - height / 2}px` });
	}
	const { width, height } = g.graph();
	const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
	svg.setAttribute('width', width);
	svg.setAttribute('height', height);
	svg.innerHTML = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>';
	edges.forEach((e, i) => {
		const { points, x, y } = g.edge(e.from, e.to, String(i));
		const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
		let d = `M${points[0].x},${points[0].y}`;
		for (let j = 1; j < points.length - 1; j++) {
			const [p, q] = [points[j], points[j + 1]];
			d += ` Q${p.x},${p.y} ${(p.x + q.x) / 2},${(p.y + q.y) / 2}`;
		}
		d += ` L${points.at(-1).x},${points.at(-1).y}`;
		path.setAttribute('d', d);
		path.setAttribute('marker-end', 'url(#arrow)');
		path.classList.toggle('visited', walked.has(`${e.from}\n${e.to}`));
		svg.append(path);
		Object.assign(labels[i].style, { left: `${x - labels[i].offsetWidth / 2}px`, top: `${y - labels[i].offsetHeight / 2}px` });
	});
	canvas.prepend(svg);
	Object.assign(canvas.style, { width: `${width}px`, height: `${height}px` });
}

function renderBar() {
	bar.replaceChildren(el('strong', 'title', document.title));
	if (dirty) bar.append(el('span', 'dirty', '● unsaved'));
	for (const [dim, values] of Object.entries(graph.dims)) {
		const select = el('select');
		for (const v of ['all', ...values]) select.append(new Option(v, v, false, sel.variants[dim] === v));
		if (!(dim in sel.variants)) select.value = 'all';
		select.addEventListener('change', () => {
			if (select.value === 'all') delete sel.variants[dim];
			else sel.variants[dim] = select.value;
			render();
		});
		const label = el('label', 'dim', `${dim} `);
		label.append(select);
		bar.append(label);
	}
	const range = el('input');
	Object.assign(range, { type: 'range', min: 0.1, max: 3, step: 0.1, value: spacing });
	range.addEventListener('change', () => { // not `input`: render() rebuilds the bar, which would drop the slider mid-drag
		spacing = Number(range.value);
		localStorage.setItem(SPACING_KEY, spacing);
		render();
	});
	const spacingLabel = el('label', 'dim', 'spacing ');
	spacingLabel.append(range);
	bar.append(spacingLabel);
	const button = (text, action, parent = bar) => {
		const b = el('button', '', text);
		b.addEventListener('click', action);
		parent.append(b);
		return b;
	};
	button('Labels', () => {
		renderLabels();
		labelsDialog.showModal();
	}).classList.add('push');
	button('New call', newCall).title = 'n';
	const save = el('details', 'menu');
	save.append(el('summary', '', 'Save'));
	const items = el('div', 'items');
	button('.html', () => download(`${document.title}.html`, html(), 'text/html'), items);
	button('.md', () => download(`${document.title}.md`, md, 'text/markdown'), items);
	save.append(items);
	save.title = 'download a copy; Ctrl+S overwrites the opened file';
	bar.append(save);
	button(theme === 'dark' ? '☀' : '☾', () => {
		theme = theme === 'dark' ? 'light' : 'dark';
		localStorage.setItem(THEME_KEY, theme);
		document.documentElement.dataset.theme = theme;
		renderBar();
	}).title = 'theme';
	canvas.style.marginTop = `${bar.offsetHeight}px`;
}

function newCall() {
	sel.path = [];
	render();
	scrollTo({ left: 0, top: 0, behavior: 'smooth' });
}

function pill(label) {
	const p = el('span', 'pill');
	p.textContent = label.name;
	p.title = label.description;
	p.style.background = label.color;
	p.style.color = Number(COLOR.exec(label.color)[1]) > 0.7 ? 'oklch(0.2 0 0)' : 'oklch(1 0 0)';
	return p;
}

function labelPicker(n) {
	const pick = el('select', 'add');
	pick.title = 'add a label';
	pick.append(new Option('+', '', true, true));
	pick.options[0].hidden = true;
	for (const l of graph.labels) if (!n.labels.includes(l.name)) pick.append(new Option(l.name, l.name));
	pick.append(new Option('Edit labels…', ' edit'));
	pick.addEventListener('click', e => e.stopPropagation());
	pick.addEventListener('change', () => {
		if (pick.value === ' edit') {
			renderLabels();
			labelsDialog.showModal();
			pick.value = '';
		} else assert(!commit(splice([attrs(n, [...n.labels, pick.value])])), 'adding a defined label broke the document');
	});
	return pick;
}

function renderLabels() {
	const head = el('header');
	head.append(el('h2', '', `${graph.labels.length} labels`));
	const add = el('button', 'primary', 'New label');
	add.addEventListener('click', () => {
		labelForm = { orig: null, name: '', description: '', color: randomColor() };
		renderLabels();
	});
	const close = el('button', '', 'Close');
	close.addEventListener('click', () => labelsDialog.close());
	head.append(add, close);
	labelsDialog.replaceChildren(head);
	if (labelForm && labelForm.orig === null) labelsDialog.append(labelEditor());
	const list = el('ul');
	for (const l of graph.labels) {
		if (labelForm?.orig === l.name) {
			list.append(labelEditor());
			continue;
		}
		const row = el('li');
		const uses = graph.nodes.filter(n => n.labels.includes(l.name)).length;
		const description = el('span', 'description');
		description.textContent = l.description;
		row.append(pill(l), description, el('span', 'uses', uses ? `${uses} card${uses > 1 ? 's' : ''}` : ''));
		const edit = el('button', 'link', 'Edit');
		edit.addEventListener('click', () => {
			labelForm = { orig: l.name, name: l.name, description: l.description, color: l.color };
			renderLabels();
		});
		const del = el('button', 'link danger', 'Delete');
		del.addEventListener('click', () => {
			if (!confirm(`Delete label "${l.name}"?${uses ? ` It is removed from ${uses} card${uses > 1 ? 's' : ''}.` : ''}`)) return;
			assert(!commit(splice([{ start: l.start, end: l.end, text: '' }, ...relabel(l.name, null)])), 'deleting a label broke the document');
		});
		row.append(edit, del);
		list.append(row);
	}
	labelsDialog.append(list);
}

// `name: null` drops the label
function relabel(from, name) {
	return graph.nodes.filter(n => n.labels.includes(from)).map(n => attrs(n, n.labels.flatMap(l => (l !== from ? [l] : name === null ? [] : [name]))));
}

function labelEditor() {
	const f = labelForm;
	const form = el('form', 'editor');
	const preview = el('div', 'preview');
	const errors = el('div');
	const showPreview = () => preview.replaceChildren(pill({ name: f.name || 'Label preview', description: f.description, color: COLOR.test(f.color) ? f.color : 'oklch(0.93 0 0)' }));
	const field = (label, input) => {
		const l = el('label', '', label);
		l.append(input);
		form.append(l);
	};
	const text = (key, attrsOf) => {
		const i = Object.assign(el('input'), { value: f[key], ...attrsOf });
		i.addEventListener('input', () => {
			f[key] = i.value;
			showPreview();
		});
		return i;
	};
	form.append(preview);
	field('Label name', text('name', { required: true, pattern: LABEL_NAME.source.slice(1, -1), title: 'letters, digits, _ and -' }));
	field('Description', text('description', { placeholder: 'Description (optional)' }));
	const color = el('div', 'color');
	const random = el('button', '', '⟳');
	Object.assign(random, { type: 'button', title: 'random color' });
	const value = text('color', { required: true, pattern: COLOR.source.slice(1, -1), title: 'oklch(L C H)', size: 20 });
	const set = c => {
		f.color = value.value = c;
		showPreview();
	};
	random.addEventListener('click', () => set(randomColor()));
	const swatches = el('div', 'swatches');
	for (const c of SWATCHES) {
		const b = el('button');
		Object.assign(b, { type: 'button', title: c });
		b.style.background = c;
		b.addEventListener('click', () => set(c));
		swatches.append(b);
	}
	color.append(random, value);
	field('Color', color);
	form.append(swatches);
	const cancel = el('button', '', 'Cancel');
	cancel.type = 'button';
	cancel.addEventListener('click', () => {
		labelForm = null;
		renderLabels();
	});
	form.append(cancel, el('button', 'primary', f.orig === null ? 'Create label' : 'Save changes'), errors);
	form.addEventListener('submit', e => {
		e.preventDefault();
		const line = `[${f.name}]: <${f.color}>${f.description && ` "${f.description.replace(/[\\"]/g, '\\$&')}"`}\n`;
		const def = graph.labels.find(l => l.name === f.orig);
		const last = graph.labels.at(-1);
		const edits = def ? [{ start: def.start, end: def.end, text: line }, ...(f.name !== f.orig ? relabel(f.orig, f.name) : [])] : [last ? { start: last.end, end: last.end, text: line } : { start: 0, end: 0, text: `${line}\n` }];
		labelForm = null;
		const failed = commit(splice(edits));
		if (failed) {
			labelForm = f;
			errors.replaceChildren(errorList(failed, e => e.msg));
		}
	});
	showPreview();
	return form;
}

function errorList(errors, fmt) {
	const ul = el('ul', 'errors');
	for (const e of errors) {
		const li = el('li');
		li.textContent = fmt(e);
		ul.append(li);
	}
	return ul;
}

function click(n) {
	if (editing) return;
	const now = performance.now();
	clearTimeout(revealing);
	if (lastClick.id === n.id && now - lastClick.t < DOUBLE_CLICK_MS) {
		lastClick = { id: null, t: 0 };
		edit(n);
		return;
	}
	lastClick = { id: n.id, t: now };
	go(n.id);
	revealing = setTimeout(() => reveal(n.id), DOUBLE_CLICK_MS); // scrolling earlier would move the card from under a second click
}

function go(id, from) {
	if (from !== undefined && sel.path.at(-1) !== from) sel.path.push(from);
	if (sel.path.at(-1) !== id) sel.path.push(id);
	Object.assign(sel.variants, graph.nodes.find(n => n.id === id).tags);
	render();
}

function reveal(id) {
	const targets = graph.edges.filter(e => e.from === id && cards.has(e.to)).map(e => cards.get(e.to));
	const rects = [cards.get(id), ...targets].map(c => c.getBoundingClientRect());
	const pad = 24;
	const top = bar.offsetHeight + pad;
	const scrollFor = (lo, hi, min, max) => (hi > max ? Math.min(hi - max, lo - min) : lo < min ? lo - min : 0);
	scrollBy({
		left: scrollFor(Math.min(...rects.map(r => r.left)), Math.max(...rects.map(r => r.right)), pad, innerWidth - pad),
		top: scrollFor(Math.min(...rects.map(r => r.top)), Math.max(...rects.map(r => r.bottom)), top, innerHeight - pad),
		behavior: 'smooth',
	});
}

// edits: [{start, end, text}] against the current md
function splice(edits) {
	edits.sort((a, b) => b.start - a.start);
	edits.forEach((e, i) => i && assert(e.end <= edits[i - 1].start, 'splice edits overlap'));
	return edits.reduce((s, e) => s.slice(0, e.start) + e.text + s.slice(e.end), md);
}

function assert(ok, msg) {
	if (!ok) throw new Error(msg);
}

// the errors of `next`, or null once it replaced the md
function commit(next) {
	const g = SCRIPT_TAG.test(next) ? { errors: [{ line: 0, msg: 'a <script> tag cannot be embedded' }] } : parse(next);
	if (g.errors.length) return g.errors;
	clearTimeout(revealing); // its card may be gone
	md = next;
	graph = g;
	dirty = true;
	render();
	return null;
}

// the heading's `{…}` block rewritten to carry `labels`
function attrs(n, labels) {
	const tokens = [...Object.entries(n.tags).map(([k, v]) => `${k}=${v}`), ...labels.map(l => `.${l}`)];
	return { start: n.attrs.start, end: n.attrs.end, text: tokens.length ? ` {${tokens.join(' ')}}` : '' };
}

function remove(n) {
	const last = graph.nodes.every(m => m === n || m.slot !== n.slot);
	const inside = e => e.start >= n.start && e.end <= n.end;
	const responses = last ? graph.edges.filter(e => e.to === n.id && !inside(e)) : [];
	if (!confirm(`Delete "${n.title}"?${responses.length ? ` ${responses.length} response${responses.length > 1 ? 's' : ''} leading to it go too.` : ''}`)) return;
	const errors = commit(splice([{ start: n.start, end: n.end, text: '' }, ...responses.map(e => ({ start: e.start, end: e.end, text: '' }))]));
	if (errors) alert(`Cannot delete "${n.title}":\n${errors.map(e => e.msg).join('\n')}`);
}

function edit(n) {
	editing = n.id;
	const card = cards.get(n.id);
	const ta = el('textarea');
	ta.value = md.slice(n.start, n.end).trimEnd();
	ta.spellcheck = false;
	const errors = el('div');
	card.classList.add('editing');
	card.replaceChildren(ta, errors);
	const fit = () => {
		ta.style.height = 'auto';
		ta.style.height = `${ta.scrollHeight + 2}px`;
	};
	ta.addEventListener('input', fit);
	ta.addEventListener('click', e => e.stopPropagation());
	ta.addEventListener('keydown', e => {
		if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
			e.preventDefault();
			const text = ta.value.trimEnd();
			const base = md.slice(0, n.start).split('\n').length - 1;
			const lines = text.split('\n').length;
			editing = null;
			const failed = commit(splice([{ start: n.start, end: n.end, text: text && text + (n.end < md.length ? '\n\n' : '\n') }]));
			if (failed) {
				editing = n.id;
				errors.replaceChildren(errorList(failed, e => (e.line > base && e.line <= base + lines ? `line ${e.line - base}: ${e.msg}` : e.line ? `elsewhere, document line ${e.line}: ${e.msg}` : e.msg)));
			}
		}
	});
	fit();
	ta.focus();
}

function download(name, text, type) {
	const a = document.createElement('a');
	a.href = URL.createObjectURL(new Blob([text], { type }));
	a.download = name;
	a.click();
}

function html() {
	assert(!SCRIPT_TAG.test(md), 'markdown contains a <script> tag; commit should have rejected it');
	const doc = new DOMParser().parseFromString(pristine, 'text/html');
	doc.getElementById('src').textContent = md;
	return `<!DOCTYPE html>\n${doc.documentElement.outerHTML}`;
}

// a page on file:// cannot learn its own file handle: the user picks the file once, then it is remembered per url
async function overwrite() {
	if (!window.showSaveFilePicker) {
		alert('This browser cannot overwrite files; download a copy with Save instead.');
		return;
	}
	let handle = await handles('readonly', s => s.get(location.href));
	if (handle && (await handle.requestPermission({ mode: 'readwrite' })) !== 'granted') handle = undefined;
	if (!handle) {
		try {
			handle = await showSaveFilePicker({ suggestedName: decodeURIComponent(location.pathname.split('/').at(-1)), types: [{ description: 'html', accept: { 'text/html': ['.html'] } }] });
		} catch (e) {
			if (e.name === 'AbortError') return; // the user closed the picker
			throw e;
		}
		await handles('readwrite', s => s.put(handle, location.href));
	}
	const w = await handle.createWritable();
	await w.write(html());
	await w.close();
	dirty = false;
	renderBar();
}

function handles(mode, op) {
	return new Promise((resolve, reject) => {
		const open = indexedDB.open('call_scripters', 1);
		open.onupgradeneeded = () => open.result.createObjectStore('handles');
		open.onerror = () => reject(open.error);
		open.onsuccess = () => {
			const req = op(open.result.transaction('handles', mode).objectStore('handles'));
			req.onsuccess = () => resolve(req.result);
			req.onerror = () => reject(req.error);
		};
	});
}

document.addEventListener('keydown', e => {
	const typing = e.target.closest('input, textarea, select');
	const plain = !(e.ctrlKey || e.metaKey || e.altKey);
	if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
		e.preventDefault();
		overwrite();
	} else if (labelsDialog.open) {
		return;
	} else if (e.key === 'Escape') { // document-level: the textarea loses focus on any click outside it
		if (editing) editing = null;
		else sel.path = [];
		render();
	} else if (editing || typing || !plain) {
		return;
	} else if (e.key === 'n') {
		newCall();
	} else if (e.key === 'Backspace' && cards.has(sel.path.at(-1))) {
		e.preventDefault();
		remove(graph.nodes.find(n => n.id === sel.path.at(-1)));
	}
});
document.addEventListener('click', e => {
	for (const d of document.querySelectorAll('details.menu[open]')) if (!d.contains(e.target)) d.open = false;
});
labelsDialog.addEventListener('close', () => (labelForm = null));
addEventListener('beforeunload', e => dirty && e.preventDefault());

render();

</script>
</body>
</html>
